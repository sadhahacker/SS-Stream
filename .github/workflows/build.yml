name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      # choose your default branch
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@master
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 || true

      - name: Setup JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          python3 -c '
          import json
          from pathlib import Path
          p = Path("build/plugins.json")
          if p.exists():
              data = json.loads(p.read_text())
              for item in data:
                  name = item.get("internalName", "StreamCoreProvider")
                  pkg = f"com.streamcore.{name}"
                  item["packageName"] = pkg
                  item["id"] = pkg
                  if "languages" not in item:
                      item["languages"] = [item.get("language", "en")]
                  if "categories" not in item:
                      item["categories"] = item.get("tvTypes", ["Movie", "TvSeries"])
                  if "baseUrl" not in item:
                      item["baseUrl"] = "https://api.themoviedb.org"
              p.write_text(json.dumps(data, indent=4))
          '
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds
          cp repo.json $GITHUB_WORKSPACE/builds/repo.json || true

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || git commit -m "Build $GITHUB_SHA" || exit 0
          git push --force origin builds
          curl -sL https://purge.jsdelivr.net/gh/sadhahacker/SS-Stream@builds/StreamCoreProvider.cs3 || true
          curl -sL https://purge.jsdelivr.net/gh/sadhahacker/SS-Stream@builds/plugins.json || true
          curl -sL https://purge.jsdelivr.net/gh/sadhahacker/SS-Stream@builds/repo.json || true

